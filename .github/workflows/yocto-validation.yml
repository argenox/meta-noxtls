name: Validate Yocto releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        release: [scarthgap, wrynose]
    name: ${{ matrix.release }} package and image
    runs-on: [self-hosted, Linux, X64, linux-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check builder capacity
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h "${RUNNER_TEMP}"
          command -v git
          command -v python3
      - name: Build NoxTLS and verify image manifest
        shell: bash
        run: bash scripts/validate-yocto.sh "${{ matrix.release }}"
