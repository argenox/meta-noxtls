name: Validate Yocto releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        release: [scarthgap, wrynose]
    name: ${{ matrix.release }} package and image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Yocto host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk gcc \
            git iputils-ping libacl1 libcrypt-dev locales python3 python3-git \
            python3-jinja2 python3-pexpect python3-pip python3-subunit socat \
            texinfo unzip wget xz-utils zstd
      - name: Check builder capacity
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h "${RUNNER_TEMP}"
          command -v git
          command -v python3
      - name: Enable BitBake user namespaces
        shell: bash
        run: |
          set -euo pipefail
          if unshare --user --map-root-user --fork true; then
            echo "Unprivileged user namespaces are available."
            exit 0
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --fork true
      - name: Build NoxTLS and verify image manifest
        shell: bash
        run: bash scripts/validate-yocto.sh "${{ matrix.release }}"
