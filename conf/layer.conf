BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "noxtls"
BBFILE_PATTERN_noxtls = "^${LAYERDIR}/"
BBFILE_PRIORITY_noxtls = "7"

LAYERDEPENDS_noxtls = "core"
# Add a release only after BitBake and image installation pass on that release.
LAYERSERIES_COMPAT_noxtls = ""
